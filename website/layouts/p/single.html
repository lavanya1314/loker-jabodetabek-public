<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} | Loker Jabodetabek</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.siteDesc }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ .Title }} | Loker Jabodetabek">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="theme-color" content="#066a4c">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7f6;color:#0f1f1a;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:#066a4c}
:focus-visible{outline:3px solid #087f5b;outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;margin:0;clip:auto;z-index:60;background:#066a4c;color:#fff;padding:8px 12px;border-radius:8px}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e4ebe8}
.nav-in{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#087f5b,#044c36);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.brand b{display:block;font-size:15px;letter-spacing:-.2px;line-height:1.2}
.brand small{display:block;font-size:10px;color:#5b6b65;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.menu{display:flex;gap:4px}
.menu a{font-size:14px;font-weight:500;color:#5b6b65;padding:8px 12px;border-radius:10px;text-decoration:none}
.menu a:hover{background:#f0f9f5;color:#066a4c}
main{max-width:760px;margin:0 auto;padding:20px 20px 40px}
.crumb{font-size:13px;color:#5b6b65;margin-bottom:16px}
.crumb a{text-decoration:none}
.card{background:#fff;border:1px solid #e4ebe8;border-radius:16px;box-shadow:0 1px 2px rgba(15,31,26,.05),0 6px 20px rgba(15,31,26,.05);padding:28px}
h1{font-size:clamp(20px,3.4vw,26px);line-height:1.25;letter-spacing:-.5px;font-weight:800;margin-bottom:16px}
.body{font-size:15px;color:#27362f}
.body > * + *{margin-top:.8rem}
.body h2{font-size:17px;font-weight:700;color:#066a4c;margin-top:1.6rem}
.body ul{list-style:disc;padding-left:1.25rem}
.body ol{list-style:decimal;padding-left:1.25rem}
.body li + li{margin-top:.3rem}
@media (max-width:680px){.menu a:nth-child(n+2){display:none}.card{padding:20px}}
</style>
{{ partial "footer-style.html" . }}
</head>
<body>
<a class="skip-link sr-only" href="#konten">Lewati ke konten</a>
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark" aria-hidden="true">LJ</span>
      <span><b>LOKER JABODETABEK</b><small>Karier &amp; peluang terverifikasi</small></span>
    </a>
    <nav class="menu" aria-label="Menu utama"><a href="{{ "/" | relURL }}">Beranda</a><a href="{{ "p/tentang-kami.html" | relURL }}">Tentang Kami</a><a href="{{ "p/kontak.html" | relURL }}">Kontak</a></nav>
  </div>
</header>
<main id="konten">
  <nav class="crumb" aria-label="Breadcrumb"><a href="{{ "/" | relURL }}">Beranda</a> / <span aria-current="page">{{ .Title }}</span></nav>
  <article class="card">
    <h1>{{ .Title }}</h1>
    <div class="body">{{ .Content }}</div>
  </article>
</main>
{{ partial "footer.html" . }}
</body>
</html>
