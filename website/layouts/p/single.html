{{ define "main" }}
<main id="konten" class="mx-auto flex w-full max-w-[1100px] flex-col px-4 py-4">
  <nav class="crumb mt-4" aria-label="Breadcrumb">
    <a href="{{ "/" | relURL }}">Beranda</a>
    <i aria-hidden="true">/</i>
    <span class="cur">{{ .Title }}</span>
  </nav>

  <section class="card">
    <h1 class="font-headline-sm text-[20px] font-bold leading-snug text-on-surface">{{ .Title }}</h1>
    <div class="job-body mt-4 text-[14px] leading-relaxed text-on-surface">
      {{ .Content }}
    </div>
  </section>
</main>
{{ end }}
