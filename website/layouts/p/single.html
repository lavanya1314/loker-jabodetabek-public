{{ define "main" }}
<main id="konten" class="mx-auto flex w-full max-w-3xl flex-1 flex-col gap-3 px-4 py-4 md:gap-6 md:px-6 md:py-8">
  <nav aria-label="Breadcrumb" class="text-[12px] text-on-surface-variant md:text-[13px]">
    <a href="{{ "/" | relURL }}" class="hover:text-primary">Beranda</a>
    <span aria-hidden="true">/</span>
    <span>{{ .Title }}</span>
  </nav>
  <article class="rounded-xl border border-outline-variant/35 bg-surface-container-lowest p-4 shadow-sm md:rounded-3xl md:p-8">
    <h1 class="font-headline text-[18px] font-extrabold tracking-tight text-on-surface md:text-[24px]">{{ .Title }}</h1>
    <div class="job-body mt-4 text-[13px] leading-relaxed text-on-surface md:text-[15px]">
      {{ .Content }}
    </div>
  </article>
</main>
{{ end }}
