<style>
    .site-footer{background:linear-gradient(180deg,#044c36,#033526);color:#cfe6dc;margin-top:8px}
    .ft{max-width:960px;margin:0 auto;padding:36px 20px 24px;width:100%}
    .ft-top{display:grid;grid-template-columns:1fr 1fr;gap:28px 24px;align-items:start}
    .ft-about{grid-column:1/-1;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.12)}
    .ft-brand{display:inline-flex;align-items:center;gap:10px}
    .ft-mark{width:36px;height:36px;border-radius:10px;background:#fff;color:#066a4c;font-weight:800;font-size:14px;display:grid;place-items:center}
    .ft-brand b{display:block;color:#fff;font-size:15px;line-height:1.2;font-family:'Plus Jakarta Sans',sans-serif}
    .ft-brand small{display:block;font-size:10px;color:#9cc5b5;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
    .ft-about p{font-size:13px;line-height:1.75;margin-top:14px;color:#b5d4c7}
    .ft-col h4{font-size:14px;font-weight:700;color:#fff;margin-bottom:14px;padding-bottom:12px;position:relative;font-family:'Plus Jakarta Sans',sans-serif}
    .ft-col h4::after{content:"";position:absolute;left:0;bottom:0;width:28px;height:3px;border-radius:3px;background:#34b58a}
    .ft-col ul{list-style:none;margin:0;padding:0}
    .ft-col li+li{border-top:1px solid rgba(255,255,255,.08)}
    .ft-col a{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:13.5px;color:#b5d4c7;transition:color .2s,gap .2s}
    .ft-col a::before{content:"";width:6px;height:6px;border-right:2px solid #34b58a;border-top:2px solid #34b58a;transform:rotate(45deg);flex:none}
    .ft-col a:hover{color:#fff;gap:11px}
    .ft-note{margin-top:26px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:12px;line-height:1.7;color:#b5d4c7;text-align:left}
    .ft-note b,.ft-note a{color:#fff}.ft-note a{text-decoration:underline}
    .ft-bot{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#8fb9a8;text-align:left}
    @media (min-width:768px){.ft-top{grid-template-columns:1.5fr 1fr 1fr;gap:40px}.ft-about{grid-column:auto;padding-bottom:0;border:0}}
  </style>
